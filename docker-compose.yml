services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: skribo
      POSTGRES_PASSWORD: skribo
      POSTGRES_DB: skribo
    ports:
      # host 5433 → avoid clashing with the expeditor project's Postgres on 5432
      - "5433:5432"
    volumes:
      - skribo_pgdata:/var/lib/postgresql/data
volumes:
  skribo_pgdata:
